name: D16 QEMU firmware stack

# Builds the custom kgpe-d16-bmc (AST2050) QEMU + the new firmware stack from
# source (C1) and boots it to an SSH login (C2). Also builds Raptor
# Engineering's 2.6.28 AST2050 kernel + a musl userspace from source and boots
# it on the same machine via ATAGS (C3). Proprietary Dell firmware boots to its
# BMC web service (C4). Phase-6 boot-nfsroot (C5) boots the same modern kernel
# with its root filesystem served over NFS (root=/dev/nfs, ip=dhcp) through QEMU
# slirp to a host nfs-kernel-server — the netboot+NFS transport OpenBMC uses.
on:
  push:
    paths:
      - 'asus-kgpe-d16-firmware/**'
      - '.github/workflows/d16-qemu-stack.yml'
  pull_request:
    paths:
      - 'asus-kgpe-d16-firmware/**'
      - '.github/workflows/d16-qemu-stack.yml'
  workflow_dispatch:

concurrency:
  group: d16-qemu-${{ github.ref }}
  cancel-in-progress: true

env:
  QEMU_DEPS: build-essential ninja-build pkg-config python3 python3-venv libglib2.0-dev libpixman-1-dev libslirp-dev flex bison
  XC_DEPS: gcc-arm-linux-gnueabi libc6-dev-armel-cross bc flex bison libssl-dev libelf-dev u-boot-tools device-tree-compiler

jobs:
  build-qemu:
    name: Build custom QEMU (kgpe-d16-bmc / AST2050)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $QEMU_DEPS
      - uses: astral-sh/setup-uv@v5
      - name: Build qemu-system-arm
        run: sh asus-kgpe-d16-firmware/qemu-firmware/scripts/build-qemu.sh
      - name: Smoke-test the machine instantiates
        run: |
          uv run asus-kgpe-d16-firmware/qemu-firmware/scripts/run-qemu.py smoke \
            --qemu asus-kgpe-d16-firmware/qemu-firmware/qemu/build/qemu-system-arm \
            --timeout 15

  build-kernel:
    name: Build D16 kernel (uImage + dtb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $XC_DEPS
      - name: Build kernel
        run: sh asus-kgpe-d16-firmware/qemu-firmware/scripts/build-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: asus-kgpe-d16-firmware/qemu-firmware/kernel/out/
          if-no-files-found: error

  build-initramfs:
    name: Build initramfs (BusyBox + dropbear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabi libc6-dev-armel-cross bzip2 cpio \
            u-boot-tools openssh-client make
      - uses: astral-sh/setup-uv@v5
      - name: Build initramfs
        run: uv run asus-kgpe-d16-firmware/qemu-firmware/initramfs/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: initramfs
          path: asus-kgpe-d16-firmware/qemu-firmware/initramfs/out/
          if-no-files-found: error

  boot-ssh:
    name: Boot new stack + SSH login (C2)
    runs-on: ubuntu-latest
    needs: [build-kernel, build-initramfs]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $QEMU_DEPS openssh-client
      - uses: astral-sh/setup-uv@v5
      - name: Build qemu-system-arm (from the submodule)
        run: sh asus-kgpe-d16-firmware/qemu-firmware/scripts/build-qemu.sh
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: kernel-out
      - uses: actions/download-artifact@v4
        with:
          name: initramfs
          path: initramfs-out
      - name: Boot kgpe-d16-bmc and SSH in
        run: |
          chmod 600 initramfs-out/id_kgpe_d16_test
          uv run asus-kgpe-d16-firmware/qemu-firmware/scripts/ssh-test.py \
            --qemu asus-kgpe-d16-firmware/qemu-firmware/qemu/build/qemu-system-arm \
            --kernel kernel-out/zImage-kgpe-d16 \
            --initrd initramfs-out/initramfs.cpio.gz \
            --dtb kernel-out/aspeed-bmc-asus-kgpe-d16.dtb \
            --key initramfs-out/id_kgpe_d16_test \
            --boot-timeout 240

  boot-nfsroot:
    name: Boot faithful machine with root over NFS (C5 / Phase 6a)
    runs-on: ubuntu-latest
    needs: [build-kernel, build-initramfs]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $QEMU_DEPS openssh-client nfs-kernel-server nfs-common
      - uses: astral-sh/setup-uv@v5
      - name: Build qemu-system-arm (from the submodule)
        run: sh asus-kgpe-d16-firmware/qemu-firmware/scripts/build-qemu.sh
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel-out }
      - uses: actions/download-artifact@v4
        with: { name: initramfs, path: initramfs-out }
      - name: Export the BusyBox rootfs over NFS (localhost, insecure for slirp)
        run: |
          sudo mkdir -p /export/kgpe-d16-rootfs
          sudo tar -C /export/kgpe-d16-rootfs -xf initramfs-out/nfs-rootfs.tar
          echo "=== extracted NFS rootfs ==="; sudo ls -la /export/kgpe-d16-rootfs
          # NFSv3 over QEMU slirp: the guest reaches the server as 127.0.0.1 with
          # a high source port, so the export must be 'insecure'; no_root_squash
          # lets guest-root read the root-owned tree.
          echo '/export/kgpe-d16-rootfs *(rw,sync,no_subtree_check,no_root_squash,insecure)' \
            | sudo tee /etc/exports
          sudo nfsconf --set nfsd vers3 y
          sudo modprobe nfsd
          sudo systemctl restart rpcbind
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -ra
          echo "=== active exports ==="; sudo exportfs -v
          echo "=== rpc services ==="; rpcinfo -p 127.0.0.1
      - name: Boot kgpe-d16-bmc with root over NFS + SSH check
        run: |
          chmod 600 initramfs-out/id_kgpe_d16_test
          uv run asus-kgpe-d16-firmware/qemu-firmware/scripts/nfsboot-test.py \
            --qemu asus-kgpe-d16-firmware/qemu-firmware/qemu/build/qemu-system-arm \
            --kernel kernel-out/zImage-kgpe-d16 \
            --dtb kernel-out/aspeed-bmc-asus-kgpe-d16.dtb \
            --nfsroot 10.0.2.2:/export/kgpe-d16-rootfs \
            --key initramfs-out/id_kgpe_d16_test \
            --boot-timeout 300

  f5-ipmi-lan:
    name: F5 — IPMI over LAN (RMCP+) in 64 MB (OpenBMC NFS root)
    runs-on: ubuntu-latest
    needs: [build-kernel]
    # Needs the fuller OpenBMC rootfs (obmc-phosphor-image-ast2050-full), whose
    # Yocto build is multi-hour, so it is NOT built here — it must be published
    # as an artifact/release named 'openbmc-full-rootfs' (a tar of the rootfs).
    # Until that artifact exists this job is manual-dispatch only (like build-uboot).
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $QEMU_DEPS openssh-client nfs-kernel-server nfs-common ipmitool
      - uses: astral-sh/setup-uv@v5
      - name: Build qemu-system-arm (from the submodule)
        run: sh asus-kgpe-d16-firmware/qemu-firmware/scripts/build-qemu.sh
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel-out }
      - uses: actions/download-artifact@v4
        with: { name: openbmc-full-rootfs, path: obmc-out }
      - name: Export the OpenBMC fuller rootfs over NFS (localhost, insecure for slirp)
        run: |
          sudo mkdir -p /export/openbmc-full
          sudo tar -C /export/openbmc-full -xf obmc-out/openbmc-full-rootfs.tar
          echo '/export/openbmc-full *(rw,sync,no_subtree_check,no_root_squash,insecure)' \
            | sudo tee /etc/exports
          sudo nfsconf --set nfsd vers3 y
          sudo modprobe nfsd
          sudo systemctl restart rpcbind
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -ra
          echo "=== active exports ==="; sudo exportfs -v
      - name: Boot kgpe-d16-bmc with the IPMI daemon set + drive ipmitool over LAN
        run: |
          uv run asus-kgpe-d16-firmware/openbmc/bmc-functionality/f5-ipmi-test.py \
            --qemu asus-kgpe-d16-firmware/qemu-firmware/qemu/build/qemu-system-arm \
            --kernel kernel-out/zImage-kgpe-d16 \
            --dtb kernel-out/aspeed-bmc-asus-kgpe-d16.dtb \
            --nfsroot 10.0.2.2:/export/openbmc-full --mem 64 \
            --evidence-dir f5-evidence --boot-timeout 1200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f5-ipmi-evidence
          path: f5-evidence/

  build-uboot:
    name: Build new U-Boot (OpenBMC AST2400)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $XC_DEPS
      - name: Build U-Boot
        run: sh asus-kgpe-d16-firmware/qemu-firmware/uboot/build-uboot.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uboot
          path: asus-kgpe-d16-firmware/qemu-firmware/uboot/out/
          if-no-files-found: error

  boot-uboot-ssh:
    name: Boot U-Boot -> Linux + SSH login (C2 full chain)
    runs-on: ubuntu-latest
    needs: [build-uboot, build-kernel, build-initramfs]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $QEMU_DEPS openssh-client u-boot-tools
      - uses: astral-sh/setup-uv@v5
      - name: Build qemu-system-arm (from the submodule)
        run: sh asus-kgpe-d16-firmware/qemu-firmware/scripts/build-qemu.sh
      - uses: actions/download-artifact@v4
        with: { name: uboot, path: uboot-out }
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: kernel-out }
      - uses: actions/download-artifact@v4
        with: { name: initramfs, path: initramfs-out }
      - name: Assemble flash + boot U-Boot -> Linux + SSH
        run: |
          chmod 600 initramfs-out/id_kgpe_d16_test
          uv run asus-kgpe-d16-firmware/qemu-firmware/scripts/mkflash.py \
            --uboot uboot-out/u-boot.bin \
            --kernel kernel-out/uImage-kgpe-d16 \
            --initrd initramfs-out/uInitrd-kgpe-d16 \
            --dtb kernel-out/aspeed-bmc-asus-kgpe-d16.dtb \
            --out flash.img
          uv run asus-kgpe-d16-firmware/qemu-firmware/scripts/ssh-test.py \
            --qemu asus-kgpe-d16-firmware/qemu-firmware/qemu/build/qemu-system-arm \
            --flash flash.img \
            --key initramfs-out/id_kgpe_d16_test \
            --boot-timeout 240

  # ---- C3: Raptor Engineering AST2050 stack (2.6.28 kernel + musl userspace) ----

  build-raptor-kernel:
    name: Build Raptor 2.6.28 kernel (C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc git wget xz-utils u-boot-tools make libmpfr6
      - uses: astral-sh/setup-uv@v5
      - name: Build Raptor kernel (vintage gcc-4.9.4, fetched by the script)
        run: sh asus-kgpe-d16-firmware/qemu-firmware/raptor/scripts/build-raptor-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: raptor-kernel
          path: asus-kgpe-d16-firmware/qemu-firmware/raptor/out/uImage-raptor
          if-no-files-found: error

  build-raptor-userspace:
    name: Build Raptor userspace (musl BusyBox + dropbear) (C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget xz-utils bzip2 cpio u-boot-tools openssh-client make
      - uses: astral-sh/setup-uv@v5
      - name: Build musl userspace (musl toolchain fetched by the script)
        run: sh asus-kgpe-d16-firmware/qemu-firmware/raptor/scripts/build-raptor-userspace.sh
      - uses: actions/upload-artifact@v4
        with:
          name: raptor-userspace
          path: |
            asus-kgpe-d16-firmware/qemu-firmware/raptor/out/uInitrd-raptor
            asus-kgpe-d16-firmware/qemu-firmware/raptor/out/id_kgpe_d16_test
          if-no-files-found: error

  boot-raptor:
    name: Boot Raptor U-Boot -> 2.6.28 Linux + SSH (C3)
    runs-on: ubuntu-latest
    needs: [build-uboot, build-raptor-kernel, build-raptor-userspace]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $QEMU_DEPS openssh-client u-boot-tools
      - uses: astral-sh/setup-uv@v5
      - name: Build qemu-system-arm (from the submodule)
        run: sh asus-kgpe-d16-firmware/qemu-firmware/scripts/build-qemu.sh
      - uses: actions/download-artifact@v4
        with: { name: uboot, path: uboot-out }
      - uses: actions/download-artifact@v4
        with: { name: raptor-kernel, path: raptor-kernel-out }
      - uses: actions/download-artifact@v4
        with: { name: raptor-userspace, path: raptor-userspace-out }
      - name: Assemble flash + boot Raptor U-Boot -> Linux 2.6.28 + SSH
        run: |
          chmod 600 raptor-userspace-out/id_kgpe_d16_test
          uv run asus-kgpe-d16-firmware/qemu-firmware/raptor/scripts/mkflash-raptor.py \
            --uboot uboot-out/u-boot.bin \
            --kernel raptor-kernel-out/uImage-raptor \
            --initrd raptor-userspace-out/uInitrd-raptor \
            --out flash-raptor.img
          uv run asus-kgpe-d16-firmware/qemu-firmware/scripts/ssh-test.py \
            --qemu asus-kgpe-d16-firmware/qemu-firmware/qemu/build/qemu-system-arm \
            --flash flash-raptor.img \
            --key raptor-userspace-out/id_kgpe_d16_test \
            --boot-timeout 240

  boot-c4-web:
    name: Boot proprietary firmware -> BMC web service (C4)
    runs-on: ubuntu-latest
    needs: [build-uboot]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $QEMU_DEPS u-boot-tools squashfs-tools
      - uses: astral-sh/setup-uv@v5
      - name: Build qemu-system-arm (from the submodule)
        run: sh asus-kgpe-d16-firmware/qemu-firmware/scripts/build-qemu.sh
      - uses: actions/download-artifact@v4
        with: { name: uboot, path: uboot-out }
      - name: Build C4 flash from the committed Dell C410X firmware
        run: |
          uv run asus-kgpe-d16-firmware/qemu-firmware/proprietary/build-c4-flash.py \
            --zip dell-c410x-firmware/backup/c410xbmc135.zip \
            --uboot uboot-out/u-boot.bin \
            --out c4out
      - name: Boot proprietary firmware + verify BMC web service reachable
        run: |
          uv run asus-kgpe-d16-firmware/qemu-firmware/proprietary/web-test.py \
            --qemu asus-kgpe-d16-firmware/qemu-firmware/qemu/build/qemu-system-arm \
            --flash c4out/flash-c4.img \
            --port 8080 \
            --boot-timeout 300

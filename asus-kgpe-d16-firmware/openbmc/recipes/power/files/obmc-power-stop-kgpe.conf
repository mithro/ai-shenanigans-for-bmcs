# Drop-in for obmc-power-stop@.service (phosphor-state-manager chassis power-off).
# Uses the board-faithful Raptor force-off PULSE (kgpe-power.sh off): a momentary
# CTL_REQ_POWERDOWN_N low, reset untouched. Routing both directions through
# kgpe-power.sh keeps the A4 lockout asserted and the drive method consistent.
#
# Stop op-pwrctl first to release B1/F0/B6 (it claims them for pgood), drive, then
# restart it. The leading '-' ignores op-pwrctl not being active.
[Service]
ExecStartPre=-/bin/systemctl stop org.openbmc.control.Power@0.service
ExecStart=
ExecStart=/usr/bin/kgpe-power.sh off
ExecStartPost=-/bin/systemctl start org.openbmc.control.Power@0.service

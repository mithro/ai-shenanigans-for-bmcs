# Drop-in for obmc-power-stop@.service (phosphor-state-manager chassis power-off).
# Uses the board-faithful Raptor force-off PULSE (kgpe-power.sh off): a momentary
# CTL_REQ_POWERDOWN_N low, reset untouched. (op-pwrctl's held-level force-off does
# work on silicon, but routing both directions through kgpe-power.sh keeps the A4
# lockout asserted and the drive method consistent.)
[Service]
ExecStart=
ExecStart=/usr/bin/kgpe-power.sh off

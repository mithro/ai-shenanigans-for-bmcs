# Drop-in for obmc-power-start@.service (phosphor-state-manager chassis power-on).
# Replaces op-pwrctl's held-level setPowerState with the board-faithful Raptor
# PULSE (kgpe-power.sh on). op-pwrctl's held-level drive DEADLOCKS on the KGPE-D16
# (it asserts RESET_OUT low until pgood, which never arrives while the board is
# held in reset) and never issues the momentary power-up pulse the board wants.
# kgpe-power.sh on also (re)asserts the A4 lockout the board requires for power-on.
[Service]
ExecStart=
ExecStart=/usr/bin/kgpe-power.sh on

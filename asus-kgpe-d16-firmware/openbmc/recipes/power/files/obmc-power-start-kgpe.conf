# Drop-in for obmc-power-start@.service (phosphor-state-manager chassis power-on).
# Replaces op-pwrctl's held-level setPowerState with the board-faithful Raptor
# PULSE (kgpe-power.sh on). op-pwrctl's held-level drive DEADLOCKS on the KGPE-D16
# (asserts RESET_OUT low until pgood, which never arrives while the board is held
# in reset) and never issues the momentary power-up pulse the board wants.
# kgpe-power.sh on also (re)asserts the A4 lockout the board requires for power-on.
#
# op-pwrctl claims B1/F0/B6 (libgpiod) for its pgood role, so we stop it first to
# release those lines, drive, then restart it (kgpe-power.sh releases the lines at
# the end). The leading '-' ignores op-pwrctl not being active.
[Service]
ExecStartPre=-/bin/systemctl stop org.openbmc.control.Power@0.service
ExecStart=
ExecStart=/usr/bin/kgpe-power.sh on
ExecStartPost=-/bin/systemctl start org.openbmc.control.Power@0.service

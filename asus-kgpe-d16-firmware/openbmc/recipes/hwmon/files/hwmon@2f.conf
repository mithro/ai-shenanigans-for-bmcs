# phosphor-hwmon config for the KGPE-D16 W83795G hardware monitor (F-IMG2 (b)).
#
# Installed (by kgpe-d16-hwmon-config.bb) at the OF full-path of the DTS node:
#   /etc/default/obmc/hwmon/ahb/apb/bus@1e78a000/i2c-bus@80/hwmon@2f.conf
# (i2c@80 == aspeed &i2c1 == the BMC's I2C bus 1; hwmon@2f == the W83795G node in
# aspeed-bmc-asus-kgpe-d16.dts). The shipped /usr/lib/udev/rules.d/70-hwmon.rules
# starts phosphor-hwmon's Hwmon@.service for this device once the config exists.
#
# LABEL_<hwmon-channel>=<name>: phosphor-hwmon publishes each mapped W83795G
# sysfs channel (fanN_input, inN_input, tempN_input from drivers/hwmon/w83795.c)
# as a D-Bus sensor object at /xyz/openbmc_project/sensors/<type>/<name>. These
# names are the KGPE-D16-proper rail names; they MUST match the `path` leaves in
# the kgpe-d16 IPMI sensor map (kgpe-d16-sensor.yaml) so phosphor-ipmi-host
# surfaces them in `ipmitool sdr`/`sensor` with real readings.

# --- Fans: W83795G fan1..fan6 -> FAN1..FAN6 (direct RPM) ----------------------
# fan7/fan8 exist but are unpopulated on this chassis (read 0); left unmapped.
LABEL_fan1=FAN1
LABEL_fan2=FAN2
LABEL_fan3=FAN3
LABEL_fan4=FAN4
LABEL_fan5=FAN5
LABEL_fan6=FAN6

# --- Temperatures ------------------------------------------------------------
# temp1 = W83795 analog thermal-diode channel (CPU); temp7/temp8 = the two DTS
# (AMD SB-TSI per-socket die) channels exposed by the modernised w83795 driver.
LABEL_temp1=CPU_DIODE
LABEL_temp7=CPU0_DTS
LABEL_temp8=CPU1_DTS

# --- Voltages ----------------------------------------------------------------
# W83795 in-channels (2 mV/bit, except in12..in14 at 6 mV/bit). The 5V/12V rails
# reach nominal via the resistor-divider GAINs (as the q71l iio-hwmon conf does).
LABEL_in0=VCORE0
LABEL_in1=VCORE1
LABEL_in2=P1V5
LABEL_in3=P1V1
LABEL_in8=P0V9
LABEL_in12=P3V3
LABEL_in14=VBAT
# 5 V rail: W83795 in4 (~1.80 V) * 2.7778 = 5.00 V (divider emulation).
LABEL_in4=P5V
GAIN_in4=2.7778
# 12 V rail: W83795 in6 (~1.05 V) * 11.4286 = 12.00 V (divider emulation).
LABEL_in6=P12V
GAIN_in6=11.4286

# Poll every 3 s (values are static in the QEMU model; the real chip updates).
INTERVAL=3000000

# Sensor id for /ahb/apb/bus@1e78a000/i2c-bus@80/hwmon@2f (sha256 of the OF
# full-path, the phosphor-hwmon convention; Hwmon@.service passes it as
# `phosphor-hwmon-readd -i ${HW_SENSOR_ID}`, and the broad
# /etc/dbus-1/system.d/phosphor-hwmon.conf policy lets it own the bus name).
HW_SENSOR_ID = "e59e99728930edfdf4a8de392356c5bcc68234e1590197851869e36a1d2016e4"

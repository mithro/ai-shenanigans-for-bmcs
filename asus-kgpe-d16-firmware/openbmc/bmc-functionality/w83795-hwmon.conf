# phosphor-hwmon config for the KGPE-D16 W83795G hardware monitor.
#
# Install as (the OF full-path of the DTS node, see 70-hwmon.rules -> %I):
#   /etc/default/obmc/hwmon/ahb/apb/bus@1e78a000/i2c-bus@80/hwmon@2f.conf
# (i2c@80 == aspeed &i2c1 == the BMC's I2C bus 1; hwmon@2f == the W83795G node
#  in aspeed-bmc-asus-kgpe-d16.dts). phosphor-hwmon's Hwmon@.service is started
# for this device by /usr/lib/udev/rules.d/70-hwmon.rules once the config exists.
#
# LABEL_<hwmon-channel>=<dbus-sensor-name>: phosphor-hwmon publishes each mapped
# hwmon sysfs channel (fanN_input, inN_input, tempN_input from
# drivers/hwmon/w83795.c) as a D-Bus sensor object; phosphor-ipmi-host then
# surfaces it in `ipmitool sdr`/`sensor` and bmcweb in Redfish Thermal/Power.
#
# NAMING CAVEAT: the running image is built for the ast2400 quanta-q71l machine
# (ARMv5TE = the AST2050 CPU), so the IPMI SDR *names* are that build's defaults
# (fan1-8, pvcc_cpu*, p3v3_scaled, temp*). We map the W83795G channels onto those
# existing SDR names so real readings light them up end-to-end; a KGPE-D16-proper
# naming (VCORE1/CPU1_DIE/...) needs an image rebuild with a kgpe-d16 sensor YAML
# (see HW-WIRING-power-sensors.md 3.3). The GAINs on the 5V/12V rails mirror the
# external resistor dividers a real board uses to bring those rails into the
# W83795G input range (exactly as the q71l iio-hwmon.conf does for its ADC).

# --- Fans: W83795G fan1..fan8 -> SDR fan1..fan8 (direct RPM) ------------------
LABEL_fan1=fan1
LABEL_fan2=fan2
LABEL_fan3=fan3
LABEL_fan4=fan4
LABEL_fan5=fan5
LABEL_fan6=fan6
LABEL_fan7=fan7
LABEL_fan8=fan8

# --- Temperatures ------------------------------------------------------------
# temp1 = W83795 analog thermal-diode channel (CPU); temp7/temp8 = the two DTS
# (AMD SB-TSI per-socket die) channels. Mapped onto the image's temp SDR names.
LABEL_temp1=temp1
LABEL_temp7=temp2_inlet
LABEL_temp8=temp3

# --- Voltages ----------------------------------------------------------------
# W83795 in0..in16 (2 mV/bit, except in12..in14 at 6 mV/bit) -> rail SDR names.
LABEL_in0=pvcc_cpu0
LABEL_in1=pvcc_cpu1
LABEL_in2=pvcc_cpu2
LABEL_in3=pvcc_cpu3
LABEL_in8=p1v1_ssb
LABEL_in12=p3v3_scaled
LABEL_in13=p3v3_aux_scaled
LABEL_in14=p3v_vbat
# 5V / 12V rails: raw W83795 reading * GAIN = nominal rail (divider emulation).
LABEL_in4=p5v_scaled
GAIN_in4=2.7778
LABEL_in5=p5v_aux_scaled
GAIN_in5=4.1667
LABEL_in6=p12v_scaled
GAIN_in6=11.4286
LABEL_in7=p12v_aux_scaled
GAIN_in7=8.0

# Poll every 3 s (sensor values are static in the QEMU model; the real chip
# updates continuously).
INTERVAL=3000000

# Sensor id for /ahb/apb/bus@1e78a000/i2c-bus@80/hwmon@2f
# (sha256 of the OF full-path, the OpenBMC phosphor-hwmon convention; the
#  Hwmon@.service passes it as `phosphor-hwmon-readd -i ${HW_SENSOR_ID}`, and the
#  broad /etc/dbus-1/system.d/phosphor-hwmon.conf policy -- own_prefix
#  "xyz.openbmc_project.Hwmon" -- lets it own the resulting bus name).
HW_SENSOR_ID = "e59e99728930edfdf4a8de392356c5bcc68234e1590197851869e36a1d2016e4"

[binaries]
c = 'arm-linux-gnueabi-gcc'
cpp = 'arm-linux-gnueabi-g++'
ar = 'arm-linux-gnueabi-ar'
ld = 'arm-linux-gnueabi-ld'
strip = 'arm-linux-gnueabi-strip'
pkg-config = 'false'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv5te'
endian = 'little'

[built-in options]
c_args = ['-march=armv5te']
prefer_static = true

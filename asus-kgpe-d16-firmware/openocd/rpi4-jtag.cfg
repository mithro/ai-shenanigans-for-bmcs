# rpi4-jtag.cfg — Raspberry Pi 4B as a bit-bang JTAG adapter
# ----------------------------------------------------------------------------
# Drives the ASUS KGPE-D16 AST_JTAG1 (AST2050 ARM926EJ-S) 20-pin ARM header.
# Pair with:  openocd -f rpi4-jtag.cfg -f ast2050.cfg -f kgpe-d16-bmc.cfg
#
# Signal mapping (BCM GPIO -> RPi4 40-pin physical -> AST_JTAG1 ARM 20-pin):
#   TCK  = GPIO25  (pin 22) -> AST_JTAG1 pin  9
#   TMS  = GPIO24  (pin 18) -> AST_JTAG1 pin  7
#   TDI  = GPIO23  (pin 16) -> AST_JTAG1 pin  5
#   TDO  = GPIO22  (pin 15) -> AST_JTAG1 pin 13
#   TRST = GPIO17  (pin 11) -> AST_JTAG1 pin  3   (active-low, PUSH-PULL)
#   SRST = GPIO18  (pin 12) -> AST_JTAG1 pin 15   (active-low, open-drain)
# (TRST push-pull / SRST open-drain mirrors Raptor's proven Olimex setup.)
#   GND  = any RPi GND      -> any AST_JTAG1 even pin (4/6/8.../20)  [MANDATORY]
#   VTref= AST_JTAG1 pin 1  -> measure ~3.3 V, do NOT drive from the Pi
#
# Electrical: direct 3.3 V wiring (both sides 3.3 V; RPi4 is NOT 5 V tolerant).
# Keep leads short (<10 cm) and start slow — see "adapter speed" below.
# ----------------------------------------------------------------------------

# --- Preferred driver on RPi4: libgpiod (kernel char-dev, no peripheral base) -
adapter driver linuxgpiod
# gpiochip0 is the 40-pin header on RPi 1-4. (RPi5 moved it to gpiochip4.)
adapter gpio tck  25 -chip 0
adapter gpio tms  24 -chip 0
adapter gpio tdi  23 -chip 0
adapter gpio tdo  22 -chip 0
# NOTE: newer OpenOCD (0.12.0+dev) rejects per-signal drive-mode flags
# (-push-pull/-open-drain) on the trst/srst lines; the drive modes come from
# "reset_config ... trst_push_pull srst_open_drain" in ast2050.cfg instead.
adapter gpio trst 17 -chip 0 -active-low
adapter gpio srst 18 -chip 0 -active-low -pull-up

# --- Legacy fallback: direct-mmap bitbang (faster, but base/coeffs are fiddly)
# adapter driver bcm2835gpio
# bcm2835gpio peripheral_base 0xFE000000      ;# BCM2711 / RPi4 (Pi2/3=0x3F000000)
# bcm2835gpio speed_coeffs 236181 60          ;# APPROX for RPi4 — verify/tune
# bcm2835gpio jtag_nums 25 24 23 22           ;# tck tms tdi tdo
# bcm2835gpio trst_num 17
# bcm2835gpio srst_num 18

# Start conservative. Bring the chain up at 100 kHz, then raise once the
# AST2050 IDCODE scans cleanly (see ast2050.cfg). Bit-bang + flying leads
# rarely survives above ~1 MHz.
adapter speed 100

transport select jtag

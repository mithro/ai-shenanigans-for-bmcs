# ast2050.cfg — ASPEED AST2050 SoC TAP + ARM926EJ-S core
# ----------------------------------------------------------------------------
# SoC-level config, independent of how it is wired. Loaded after the adapter
# (rpi4-jtag.cfg) and before the board file (kgpe-d16-bmc.cfg).
#
# The AST2050 is an ARM926EJ-S (ARMv5TE) at 200 MHz — a standard OpenOCD ARM9
# target. Raptor Engineering brought U-Boot up over JTAG on this exact part
# with an equivalent ast2050.cfg + olimex-jtag-tiny.cfg.
# ----------------------------------------------------------------------------

if { [info exists CHIPNAME] } { set _CHIPNAME $CHIPNAME } else { set _CHIPNAME ast2050 }

# --- TAP -----------------------------------------------------------------
# ARM926EJ-S TAPs use a 4-bit IR. The IDCODE below is a PLACEHOLDER.
#
# FIRST BRING-UP: comment out -expected-id (or leave it 0x00000000 with
# -ignore-version) and run:
#     openocd -f rpi4-jtag.cfg -f ast2050.cfg -c "init; scan_chain; shutdown"
# OpenOCD prints the real IDCODE it clocked out of the AST2050. Paste that
# value back here as -expected-id so a bad solder joint / wrong board later
# fails loudly instead of silently mis-scanning.
jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id 0x00000000 -ignore-version

# --- Core ----------------------------------------------------------------
target create $_CHIPNAME.cpu arm926ejs -endian little -chain-position $_CHIPNAME.cpu

# DCC downloads off until the chain is proven stable over flying leads.
$_CHIPNAME.cpu configure -event reset-init {
    # Place SoC-specific early init here if needed (clocks, SDRAM remap, etc).
    # Raptor's working bring-up programmed the SDRAM controller here before
    # loading U-Boot. Left empty until the basic chain + halt is confirmed.
}

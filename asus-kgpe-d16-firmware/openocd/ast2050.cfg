# ast2050.cfg — ASPEED AST2050 SoC TAP + ARM926EJ-S core
# ----------------------------------------------------------------------------
# Parameter values VERIFIED against Raptor Engineering's working ast2050.cfg
# (GPLv3) at:
#   https://www.raptorengineering.com/coreboot/kgpe-d16-bmc-port-files/openocd/
# Those values (IDCODE, IR length, reset topology, delays) are facts and are
# reproduced here; this file is original and carries the repo's Apache-2.0.
#
# Sourced by the board file (kgpe-d16-bmc.cfg), or loaded directly after the
# adapter file for SoC-only first contact (-f rpi4-jtag.cfg -f ast2050.cfg).
# Never pass both this file AND the board file on the command line — the
# board file sources this one, and the target would be created twice.
# The AST2050 is an ARM926EJ-S (ARMv5TE) at 200 MHz.
# ----------------------------------------------------------------------------

if { [info exists CHIPNAME] } { set _CHIPNAME $CHIPNAME } else { set _CHIPNAME ast2050 }
if { [info exists ENDIAN] }   { set _ENDIAN  $ENDIAN  } else { set _ENDIAN  little  }

# ARM926EJ-S generic TAP IDCODE — confirmed by Raptor on this exact AST2050.
if { [info exists CPUTAPID] } { set _CPUTAPID $CPUTAPID } else { set _CPUTAPID 0x07926f0f }

# Reset topology (Raptor, proven): both reset lines present and COMBINED
# (asserting one resets core + TAP); TRST push-pull, SRST open-drain.
reset_config trst_and_srst combined trst_push_pull srst_open_drain

jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_CPUTAPID

# Reset settle delays in ms (Raptor values; "adapter srst delay" is the
# modern spelling of the deprecated adapter_nsrst_delay).
adapter srst delay 300
jtag_ntrst_delay 200

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME arm926ejs -endian $_ENDIAN -chain-position $_TARGETNAME

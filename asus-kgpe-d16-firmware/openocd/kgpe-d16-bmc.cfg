# kgpe-d16-bmc.cfg — ASUS KGPE-D16 board specifics for the AST2050 BMC
# ----------------------------------------------------------------------------
# Loaded last:  openocd -f rpi4-jtag.cfg -f ast2050.cfg -f kgpe-d16-bmc.cfg
# Structure + values follow Raptor Engineering's proven kgpe-d16-bmc.cfg (GPLv3,
# see ast2050.cfg header for URL); reproduced as facts under Apache-2.0.
# ----------------------------------------------------------------------------

# Most of the config (TAP, target, reset topology) lives in the SoC file.
source [find ast2050.cfg]

# Board-only specifics: reset + adapter frequency (Raptor's init_board).
proc init_board {} {
    reset_config trst_and_srst
    adapter_khz 100        ;# modern: "adapter speed 100"
}


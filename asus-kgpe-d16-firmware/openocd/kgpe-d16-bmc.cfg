# kgpe-d16-bmc.cfg — ASUS KGPE-D16 board specifics for the AST2050 BMC
# ----------------------------------------------------------------------------
# Loaded last:  openocd -f rpi4-jtag.cfg -f ast2050.cfg -f kgpe-d16-bmc.cfg
# Holds anything that is true of *this board* rather than the SoC or adapter:
# reset wiring, and your bring-up workflow.
# ----------------------------------------------------------------------------

# --- Reset wiring --------------------------------------------------------
# Both nTRST (AST_JTAG1 pin 3) and nSRST (pin 15) are wired, driven open-drain
# from the Pi (see rpi4-jtag.cfg). "separate" = they are independent lines.
reset_config trst_and_srst separate srst_open_drain trst_open_drain

# If asserting SRST also wipes the TAP state (some Aspeed resets gate JTAG),
# switch to:  reset_config ... srst_gates_jtag
# and OpenOCD will re-examine the chain after each system reset.

# ----------------------------------------------------------------------------
# >>> YOUR CONTRIBUTION — bring-up policy (the part that shapes your workflow)
# ----------------------------------------------------------------------------
# Define how you want to attach to the BMC. This is a real fork in the road
# and your domain knowledge decides it; OpenOCD can't pick for you:
#
#   (a) HALT-ON-RESET — "reset init" stops the ARM926 at the reset vector
#       before U-Boot runs. Best for debugging early boot / firmware bring-up
#       from instruction zero. Needs nSRST working and reliable.
#
#   (b) ATTACH-RUNNING — let the BMC boot normally, then "halt" to inspect a
#       live U-Boot/Linux. Best for poking at an already-running system; safer
#       if SRST behaviour on this board turns out to be flaky.
#
# Implement ONE of these (≈5–10 lines). Suggested skeleton for (a):
#
#   proc kgpe_bmc_reset_halt {} {
#       # TODO: assert reset, halt at vector, then any board pre-U-Boot setup
#       reset init
#       halt
#       # arm core_state / reg pc   ;# confirm you're stopped at 0x0
#   }
#
# ...or for (b):
#
#   proc kgpe_bmc_attach {} {
#       # TODO: attach to the running BMC without resetting it
#       halt
#       # targets ; reg            ;# inspect live state
#   }
#
# Leave the chosen proc here and call it from the OpenOCD console or a -c arg.
# ----------------------------------------------------------------------------

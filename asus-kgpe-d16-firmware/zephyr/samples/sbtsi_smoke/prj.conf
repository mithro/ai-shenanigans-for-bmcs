# Pull in the I2C + Sensor subsystems; the AST2050 G3 I2C driver
# (CONFIG_I2C_ASPEED_G3) and the SB-TSI sensor driver (CONFIG_SBTSI) then
# auto-enable because the devicetree has okay "aspeed,ast2050-i2c" and
# "amd,sbtsi" nodes. The console comes from the board defconfig (M0 polling
# UART backend).
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SBTSI=y

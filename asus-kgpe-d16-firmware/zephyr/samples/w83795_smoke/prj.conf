# Pull in the I2C + Sensor subsystems; the AST2050 G3 I2C driver
# (CONFIG_I2C_ASPEED_G3) and the W83795 sensor driver (CONFIG_W83795) then
# auto-enable because the devicetree has okay "aspeed,ast2050-i2c" and
# "nuvoton,w83795" nodes. The console comes from the board defconfig (M0
# polling UART backend).
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_W83795=y

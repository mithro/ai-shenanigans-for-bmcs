# Pull in the watchdog subsystem; the AST2050 G3 driver (CONFIG_WDT_ASPEED_G3)
# then auto-enables because the devicetree has an okay "aspeed,ast2050-wdt" node.
# The console comes from the board defconfig (M0 polling UART backend), and the
# feed delays use k_msleep, which needs the M1 system tick (the board defconfig
# already sets CONFIG_SYS_CLOCK_EXISTS=y).
CONFIG_WATCHDOG=y

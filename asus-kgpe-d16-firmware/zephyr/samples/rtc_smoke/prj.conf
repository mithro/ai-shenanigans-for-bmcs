# AST2050 (G3) RTC smoke test.
# SPDX-License-Identifier: Apache-2.0
# RTC_ASPEED_G3 auto-enables (default y) because the devicetree has an okay
# "aspeed,ast2050-rtc" node and CONFIG_RTC is on.
CONFIG_RTC=y
# Alarm API (RTC04 + VIC-26 interrupt path, #187): exercised by the alarm half
# of the smoke (arm -> COUNTER match -> IRQ 26 -> callback).
CONFIG_RTC_ALARM=y

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 500" role="img" aria-label="AST_JTAG1 — BMC ARM926 JTAG" preserveAspectRatio="xMidYMid meet">
  <title>AST_JTAG1 — BMC ARM926 JTAG</title>
  <style>
    text{font-family:ui-monospace,'DejaVu Sans Mono',monospace;fill:var(--ink);}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" role="img" aria-label="BMC_FW1 — BMC SPI firmware socket (rotated to match board photo)" preserveAspectRatio="xMidYMid meet">
  <title>BMC_FW1 — BMC SPI firmware socket (pin 1 bottom-left)</title>
  <style>
    text{font-family:ui-monospace,'DejaVu Sans Mono',monospace;fill:var(--ink);}
    svg{--ink:#1a1a1a;--muted:#666;--box:#f4f4f4;--panel:#ececec;
        --blue:#2d6cdf;--green:#1a8a5a;--gold:#b8860b;--red:#c0392b;}
    @media (prefers-color-scheme: dark){
      svg{--ink:#e6e6e6;--muted:#a8a8a8;--box:#2a2a2a;--panel:#232323;
          --blue:#5b9bff;--green:#3cc98a;--gold:#e0b050;--red:#e74c3c;}
    }
    .t{font-size:19px;font-weight:700;}
    .st{font-size:12px;fill:var(--muted);}
    .sig{font-size:12.5px;font-weight:600;}
    .pn{font-size:11px;font-weight:700;}
    .m{font-size:11px;fill:var(--muted);}
    .leg{font-size:12px;}
    .board{fill:var(--panel);stroke:var(--ink);stroke-width:2;}
  </style>
<text class="t" x="24" y="34">BMC_FW1 — BMC SPI firmware / ASMB4 slot</text>
<text class="st" x="24" y="55">socketed SPI flash + feature straps · 2×7</text>
<text class="st" x="24" y="73">pin 1 = red square (bottom-left) · odd = left col / even = right</text>
<rect class="board" x="182" y="150" width="112" height="320" rx="10"/>
<rect x="195" y="429" width="26" height="26" rx="3" fill="var(--box)" stroke="var(--red)" stroke-width="2.8"/><text class="pn" x="208" y="442" text-anchor="middle" dominant-baseline="central" fill="var(--red)">1</text>
<text class="sig" x="176" y="442" text-anchor="end" dominant-baseline="central" fill="var(--blue)">SPIDO</text>
<circle cx="268" cy="442" r="12" fill="var(--box)" stroke="var(--green)" stroke-width="2.4"/><text class="pn" x="268" y="442" text-anchor="middle" dominant-baseline="central" fill="var(--green)">2</text>
<text class="sig" x="300" y="442" text-anchor="start" dominant-baseline="central" fill="var(--green)">+3V3</text>
<circle cx="208" cy="398" r="12" fill="var(--box)" stroke="var(--gold)" stroke-width="2.4"/><text class="pn" x="208" y="398" text-anchor="middle" dominant-baseline="central" fill="var(--gold)">3</text>
<text class="sig" x="176" y="398" text-anchor="end" dominant-baseline="central" fill="var(--gold)">IKVMEN#</text>
<circle cx="268" cy="398" r="12" fill="var(--box)" stroke="var(--blue)" stroke-width="2.4"/><text class="pn" x="268" y="398" text-anchor="middle" dominant-baseline="central" fill="var(--blue)">4</text>
<text class="sig" x="300" y="398" text-anchor="start" dominant-baseline="central" fill="var(--blue)">SPICS#2</text>
<circle cx="208" cy="354" r="12" fill="var(--box)" stroke="var(--muted)" stroke-width="2.4"/><text class="pn" x="208" y="354" text-anchor="middle" dominant-baseline="central" fill="var(--muted)">5</text>
<text class="sig" x="176" y="354" text-anchor="end" dominant-baseline="central" fill="var(--muted)">NC</text>
<circle cx="268" cy="354" r="12" fill="var(--box)" stroke="var(--blue)" stroke-width="2.4"/><text class="pn" x="268" y="354" text-anchor="middle" dominant-baseline="central" fill="var(--blue)">6</text>
<text class="sig" x="300" y="354" text-anchor="start" dominant-baseline="central" fill="var(--blue)">SPIDI</text>
<circle cx="208" cy="310" r="12" fill="var(--box)" stroke="var(--gold)" stroke-width="2.4"/><text class="pn" x="208" y="310" text-anchor="middle" dominant-baseline="central" fill="var(--gold)">7</text>
<text class="sig" x="176" y="310" text-anchor="end" dominant-baseline="central" fill="var(--gold)">PRESENT#</text>
<circle cx="268" cy="310" r="12" fill="var(--box)" stroke="var(--blue)" stroke-width="2.4"/><text class="pn" x="268" y="310" text-anchor="middle" dominant-baseline="central" fill="var(--blue)">8</text>
<text class="sig" x="300" y="310" text-anchor="start" dominant-baseline="central" fill="var(--blue)">SPICLK</text>
<circle cx="208" cy="266" r="12" fill="var(--box)" stroke="var(--muted)" stroke-width="2.4"/><text class="pn" x="208" y="266" text-anchor="middle" dominant-baseline="central" fill="var(--muted)">9</text>
<text class="sig" x="176" y="266" text-anchor="end" dominant-baseline="central" fill="var(--muted)">NC</text>
<circle cx="268" cy="266" r="12" fill="var(--box)" stroke="var(--gold)" stroke-width="2.4"/><text class="pn" x="268" y="266" text-anchor="middle" dominant-baseline="central" fill="var(--gold)">10</text>
<text class="sig" x="300" y="266" text-anchor="start" dominant-baseline="central" fill="var(--gold)">SOLEN#</text>
<circle cx="208" cy="222" r="12" fill="var(--box)" stroke="var(--muted)" stroke-width="2.4"/><text class="pn" x="208" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--muted)">11</text>
<text class="sig" x="176" y="222" text-anchor="end" dominant-baseline="central" fill="var(--muted)">NC</text>
<circle cx="268" cy="222" r="12" fill="var(--box)" stroke="var(--blue)" stroke-width="2.4"/><text class="pn" x="268" y="222" text-anchor="middle" dominant-baseline="central" fill="var(--blue)">12</text>
<text class="sig" x="300" y="222" text-anchor="start" dominant-baseline="central" fill="var(--blue)">SPICS#0</text>
<circle cx="208" cy="178" r="12" fill="var(--box)" stroke="var(--muted)" stroke-width="2.4"/><text class="pn" x="208" y="178" text-anchor="middle" dominant-baseline="central" fill="var(--muted)">13</text>
<text class="sig" x="176" y="178" text-anchor="end" dominant-baseline="central" fill="var(--muted)">GND</text>
<circle cx="268" cy="178" r="12" fill="var(--box)" stroke="var(--muted)" stroke-width="2.4"/><text class="pn" x="268" y="178" text-anchor="middle" dominant-baseline="central" fill="var(--muted)">14</text>
<text class="sig" x="300" y="178" text-anchor="start" dominant-baseline="central" fill="var(--muted)">NC</text>
<circle cx="28" cy="536" r="7" fill="var(--box)" stroke="var(--blue)" stroke-width="2.2"/><text class="leg" x="42" y="540">Signal / data</text><circle cx="152" cy="536" r="7" fill="var(--box)" stroke="var(--green)" stroke-width="2.2"/><text class="leg" x="166" y="540">Power</text><circle cx="232" cy="536" r="7" fill="var(--box)" stroke="var(--gold)" stroke-width="2.2"/><text class="leg" x="246" y="540">Strap / config</text><circle cx="366" cy="536" r="7" fill="var(--box)" stroke="var(--muted)" stroke-width="2.2"/><text class="leg" x="380" y="540">No-connect / GND</text>
</svg>
